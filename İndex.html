<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>abdu4773 - Kişisel Web Sitesi</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #0f172a, #1e293b); color: #f8fafc; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 30px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; transition: transform 0.3s; }
        .card:hover { transform: translateY(-5px); }
        
        .profile-pic { width: 120px; height: 120px; border-radius: 50%; border: 4px solid #38bdf8; object-fit: cover; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        
        h1 { color: #38bdf8; font-size: 24px; margin-bottom: 5px; }
        .username { color: #94a3b8; font-size: 14px; margin-bottom: 20px; font-family: monospace; }
        .section { background: rgba(15, 23, 42, 0.5); border-radius: 12px; padding: 15px; margin-bottom: 15px; text-align: left; border: 1px solid rgba(255, 255, 255, 0.05); }
        .section h2 { font-size: 15px; color: #38bdf8; margin-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 4px; text-transform: uppercase; letter-spacing: 1px; }
        .section p { font-size: 14px; color: #cbd5e1; line-height: 1.6; margin-bottom: 5px; }
        .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
        .tag { background: rgba(56, 189, 248, 0.1); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 500; }
        .footer { font-size: 11px; color: #64748b; margin-top: 15px; }
    </style>
</head>
<body>
    <div class='card'>
        <img src="profil.jpg" alt="Abdulkadir Beğiş Profil Fotoğrafı" class="profile-pic">
        
        <h1>Abdulkadir Beğiş</h1>
        <div class='username'>@abdu4773</div>
        
        <div class='section'>
            <h2>Hakkımda</h2>
            <p><strong>Doğum Yeri:</strong> İstanbul Zeytinburnu</p>
            <p><strong>Memleket:</strong> Şırnak / İdil</p>
            <p><strong>Yaş & Okul:</strong> 14 Yaşındayım, Konya Sarayönü Meslek Lisesi 1. Sınıf öğrencisiyim.</p>
        </div>
        
        <div class='section'>
            <h2>Hobilerim</h2>
            <div class='tags'>
                <span class='tag'>🏊 Yüzmek</span>
                <span class='tag'>🏃 Koşmak</span>
                <span class='tag'>⚽ Futbol</span>
                <span class='tag'>🍳 Yemek Yapmak</span>
            </div>
        </div>
        
        <div class='footer'>
            abdu4773.github.io © 2026
        </div>
    </div>
</body>
</html>
